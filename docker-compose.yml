version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: zadanie3-db
    environment:
      POSTGRES_DB: utility_db
      POSTGRES_USER: service_user
      POSTGRES_PASSWORD: service_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: